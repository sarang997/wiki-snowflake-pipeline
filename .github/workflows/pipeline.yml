name: ingest-and-dbt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # 5am UTC daily, after Wikimedia updates

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_PROFILES_DIR:    ${{ github.workspace }}/.dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 3.10 is EOL soon, use 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write dbt profiles.yml
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" << EOF
          wikipedia_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "$SNOWFLAKE_ACCOUNT"
                user: "$SNOWFLAKE_USER"
                password: "$SNOWFLAKE_PASSWORD"
                role: "$SNOWFLAKE_ROLE"
                warehouse: "$SNOWFLAKE_WAREHOUSE"
                database: "$SNOWFLAKE_DATABASE"
                schema: DBT
                threads: 4
                client_session_keep_alive: false
          EOF

      - name: Ingest yesterday's data
        run: python ingestion/ingest.py

      - name: Install dbt packages
        working-directory: wikipedia_dbt
        run: dbt deps

      - name: Run dbt models
        working-directory: wikipedia_dbt
        run: dbt run

      - name: Run dbt tests
        working-directory: wikipedia_dbt
        run: dbt test

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Pipeline failed on $(date -u). Check logs above."